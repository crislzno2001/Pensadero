<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pensadero · Cristina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Fraunces:ital,opsz,wght@1,9..144,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fff; --ink:#0c0c0c; --muted:#7a766e; --faint:#b7b2a8;
  --line:#e4e2dc; --accent:#e5342a; --sans:"Archivo",-apple-system,system-ui,sans-serif;
  --serif:"Fraunces",Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.4;-webkit-font-smoothing:antialiased}
button,input{font:inherit}
.wrap{max-width:1180px;margin:auto;padding:0 32px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:24px 0 20px;border-bottom:1px solid var(--ink)}
.brand{font-weight:800;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase}
.brand .dot{color:var(--accent)}
.date{font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:right}
.hero{padding:36px 0 22px;border-bottom:1px solid var(--ink)}
.wordmark{font-weight:900;font-size:clamp(3rem,14vw,11rem);line-height:.82;letter-spacing:-.045em;text-transform:uppercase}
.tagline{margin-top:16px;font-family:var(--serif);font-style:italic;font-size:clamp(1rem,2.2vw,1.28rem);color:var(--muted)}
.admin{display:none;padding:18px 0;border-bottom:1px solid var(--ink)}
.admin.show{display:block}
.loginrow,.composer{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.admin input{border:1px solid var(--line);padding:10px 12px;background:#fff;min-width:220px}
.admin input:focus{outline:1px solid var(--ink)}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;padding:10px 15px;cursor:pointer;font-weight:700}
.btn.light{background:#fff;color:var(--ink)}
.btn:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.admin-title{font-size:.68rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;margin-bottom:12px}
.admin-msg{margin-top:10px;font-size:.76rem;color:var(--muted)}
.types{display:flex;gap:7px;flex-wrap:wrap}
.type{font-size:.64rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:7px 12px;border:1px solid var(--faint);border-radius:999px;background:#fff;cursor:pointer}
.type.active{background:var(--ink);border-color:var(--ink);color:#fff}
.filelabel{font-size:.72rem;border:1px solid var(--line);padding:9px 12px;cursor:pointer;color:var(--muted)}
.filelabel input{display:none}
.catbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:18px 0;border-bottom:1px solid var(--ink)}
.catbar .label{font-size:.7rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{font-size:.66rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:7px 14px;border:1px solid var(--ink);border-radius:999px;background:#fff;cursor:pointer}
.pill.active{background:var(--accent);border-color:var(--accent);color:#fff}
.pill .n{opacity:.65;margin-left:5px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-left:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--ink)}
.card{background:#fff;padding:24px 24px 20px;display:flex;flex-direction:column;min-height:210px}
.c-cover{margin:-24px -24px 18px;aspect-ratio:16/10;overflow:hidden;background:var(--line)}
.c-cover img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1) contrast(1.08);transition:.25s}
.card:hover .c-cover img{filter:grayscale(.15) contrast(1.03)}
.c-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:20px}
.c-date{font-size:.68rem;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.tag{font-size:.58rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:5px 10px;border:1px solid var(--ink);border-radius:999px}
.c-title{font-weight:700;font-size:1.34rem;line-height:1.12;word-break:break-word;flex:1}
.card.done .c-title{color:var(--faint);text-decoration:line-through}
.c-foot{display:flex;align-items:center;gap:9px;margin-top:20px;padding-top:14px;border-top:1px solid var(--line)}
.state{font-size:.64rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.iconbtn{display:none;border:0;background:none;cursor:pointer;font-size:.9rem;color:var(--muted);padding:4px}
body.editor .iconbtn{display:inline-block}
.iconbtn:hover{color:var(--accent)}
.c-foot .spacer{margin-left:auto}
.empty{grid-column:1/-1;background:#fff;padding:60px 24px;text-align:center;font-family:var(--serif);font-style:italic;color:var(--faint);font-size:1.15rem}
footer{background:var(--ink);color:#fff}
.foot{max-width:1180px;margin:auto;padding:22px 32px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase}
.status{color:#c9c6bf}
.dot-s{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:8px}
@media(max-width:860px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.wrap{padding:0 20px}.grid{grid-template-columns:1fr}.foot{padding:20px}.admin input{min-width:100%;width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="brand">Cristina<span class="dot">.</span> pensadero</div>
    <div class="date" id="today">—</div>
  </header>

  <section class="hero">
    <h1 class="wordmark">Pensadero</h1>
    <p class="tagline">Un archivo de curiosidad. Lo que quiero leer, ver y no olvidar.</p>
  </section>

  <!-- Solo aparece al entrar con ?admin=1 -->
  <section class="admin" id="adminPanel">
    <div id="loginBox">
      <div class="admin-title">Entrar en modo edición</div>
      <div class="loginrow">
        <input type="email" id="loginEmail" placeholder="Tu email">
        <input type="password" id="loginPassword" placeholder="Tu contraseña">
        <button class="btn" id="loginBtn">Entrar</button>
      </div>
      <div class="admin-msg" id="loginMsg"></div>
    </div>

    <div id="editorBox" style="display:none">
      <div class="admin-title">Añadir a Pensadero</div>
      <div class="composer">
        <div class="types" id="types">
          <button class="type active" data-type="pensamiento">Pensamiento</button>
          <button class="type" data-type="lectura">Lectura</button>
          <button class="type" data-type="investigacion">Investigación</button>
          <button class="type" data-type="pelicula">Película</button>
        </div>
        <input type="text" id="composerInput" placeholder="Escribe el título o la idea…">
        <label class="filelabel">Añadir foto<input type="file" id="composerImage" accept="image/jpeg,image/png,image/webp,image/gif"></label>
        <button class="btn" id="composerAdd">Guardar</button>
        <button class="btn light" id="logoutBtn">Salir</button>
      </div>
      <div class="admin-msg" id="editorMsg">Lo que guardes aquí se publica directamente.</div>
    </div>
  </section>

  <section class="catbar">
    <span class="label">Categorías</span>
    <div class="pills" id="filters">
      <button class="pill active" data-filter="todo">Todo</button>
      <button class="pill" data-filter="pensamiento">Pensamientos</button>
      <button class="pill" data-filter="lectura">Lecturas</button>
      <button class="pill" data-filter="investigacion">Investigaciones</button>
      <button class="pill" data-filter="pelicula">Películas</button>
    </div>
  </section>

  <main class="grid" id="grid"></main>
</div>

<footer>
  <div class="foot">
    <span id="saveState" style="display:none"></span>
    <span>Pensadero · Cristina</span>
  </div>
</footer>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

/* ============================================================
   SOLO TIENES QUE PEGAR AQUÍ 2 DATOS DE TU PROYECTO SUPABASE
   Settings > API:
   - Project URL
   - Publishable key (o anon key si tu proyecto aún usa la antigua)
   NUNCA pongas aquí la service_role key.
   ============================================================ */
const SUPABASE_URL = 'https://iohshvxmzbiiroqqksdk.supabase.co';
const SUPABASE_KEY = 'sb_publishable_DQU4BAcaVhf1FRl37bGZ8w_wkLP8U2j';

const configured = !SUPABASE_URL.startsWith('PEGA_') && !SUPABASE_KEY.startsWith('PEGA_');
const db = configured ? createClient(SUPABASE_URL, SUPABASE_KEY) : null;

const TYPES={pensamiento:'Pensamiento',lectura:'Lectura',investigacion:'Investigación',pelicula:'Película'};
let entries=[];
let activeType='pensamiento';
let activeFilter='todo';
let currentUser=null;

const MES=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const MESL=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

function setToday(){
  const d=new Date(),h=d.getHours();
  const s=h<6?'Buenas noches':h<13?'Buenos días':h<21?'Buenas tardes':'Buenas noches';
  document.getElementById('today').textContent=`${s} · ${DIAS[d.getDay()]} ${d.getDate()} ${MESL[d.getMonth()]}`;
}
function cardDate(date){
  const d=new Date(date);
  return `${d.getDate()}. ${MES[d.getMonth()]} ${d.getFullYear()}`;
}
function status(text){ document.getElementById('saveState').textContent=text; }

async function loadEntries(){
  if(!configured){
    entries=[];
    status('Falta conectar Supabase');
    render();
    return;
  }
  status('Cargando…');
  const {data,error}=await db.from('entries').select('*').order('created_at',{ascending:false});
  if(error){
    console.error(error);
    status('Error al cargar');
    document.getElementById('grid').innerHTML='<div class="empty">No se ha podido cargar Pensadero.</div>';
    return;
  }
  entries=data||[];
  status('Todo sincronizado');
  render();
}

function counts(){
  const c={todo:entries.length,pensamiento:0,lectura:0,investigacion:0,pelicula:0};
  entries.forEach(e=>{ if(c[e.type]!==undefined)c[e.type]++; });
  document.querySelectorAll('#filters .pill').forEach(p=>{
    const f=p.dataset.filter,n=c[f]||0;
    let tag=p.querySelector('.n');
    if(!tag){tag=document.createElement('span');tag.className='n';p.appendChild(tag);}
    tag.textContent=n?String(n):'';
  });
}

function render(){
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  counts();
  const list=entries.filter(e=>activeFilter==='todo'||e.type===activeFilter);

  if(!list.length){
    const d=document.createElement('div');
    d.className='empty';
    d.textContent=configured
      ? (activeFilter==='todo'?'Todavía no hay nada aquí.':'Nada en esta categoría.')
      : 'Conecta Supabase para empezar a guardar tu Pensadero.';
    grid.appendChild(d);
    return;
  }

  list.forEach(e=>{
    const card=document.createElement('article');
    card.className='card'+(e.done?' done':'');

    if(e.image_url){
      const cover=document.createElement('div'); cover.className='c-cover';
      const img=document.createElement('img'); img.src=e.image_url; img.alt='';
      img.addEventListener('error',()=>cover.remove());
      cover.appendChild(img); card.appendChild(cover);
    }

    const top=document.createElement('div'); top.className='c-top';
    const dt=document.createElement('span'); dt.className='c-date'; dt.textContent=cardDate(e.created_at);
    const tg=document.createElement('span'); tg.className='tag'; tg.textContent=TYPES[e.type]||e.type;
    top.append(dt,tg);

    const title=document.createElement('div'); title.className='c-title'; title.textContent=e.text;

    const foot=document.createElement('div'); foot.className='c-foot';
    const st=document.createElement('span'); st.className='state'; st.textContent=e.done?'Hecho':'Pendiente';
    const spacer=document.createElement('span'); spacer.className='spacer';

    const done=document.createElement('button'); done.className='iconbtn'; done.textContent=e.done?'↶':'✓'; done.title=e.done?'Marcar pendiente':'Marcar hecho';
    done.addEventListener('click',()=>toggleDone(e));

    const edit=document.createElement('button'); edit.className='iconbtn'; edit.textContent='✎'; edit.title='Editar';
    edit.addEventListener('click',()=>editEntry(e));

    const del=document.createElement('button'); del.className='iconbtn'; del.textContent='×'; del.title='Borrar';
    del.addEventListener('click',()=>deleteEntry(e));

    foot.append(st,spacer,done,edit,del);
    card.append(top,title,foot);
    grid.appendChild(card);
  });
}

async function uploadImage(file){
  if(!file) return {url:'',path:''};
  const safe=(file.name||'imagen').replace(/[^a-zA-Z0-9._-]/g,'-');
  const filename=`${currentUser.id}/${Date.now()}-${safe}`;
  const {error}=await db.storage.from('pensadero').upload(filename,file,{cacheControl:'3600',upsert:false});
  if(error) throw error;
  const {data}=db.storage.from('pensadero').getPublicUrl(filename);
  return {url:data.publicUrl,path:filename};
}

async function addEntry(){
  const input=document.getElementById('composerInput');
  const file=document.getElementById('composerImage').files[0];
  const text=input.value.trim();
  if(!text)return;

  const msg=document.getElementById('editorMsg');
  try{
    msg.textContent='Guardando…';
    document.getElementById('composerAdd').disabled=true;
    const image=await uploadImage(file);
    const {error}=await db.from('entries').insert({
      owner_id:currentUser.id,
      text,
      type:activeType,
      done:false,
      image_url:image.url,
      image_path:image.path
    });
    if(error)throw error;
    input.value='';
    document.getElementById('composerImage').value='';
    msg.textContent='Guardado y publicado ✓';
    await loadEntries();
  }catch(err){
    console.error(err);
    msg.textContent='No se pudo guardar: '+(err.message||'error');
  }finally{
    document.getElementById('composerAdd').disabled=false;
  }
}

async function toggleDone(e){
  const {error}=await db.from('entries').update({done:!e.done}).eq('id',e.id);
  if(error)return alert('No se pudo guardar el cambio.');
  await loadEntries();
}

async function editEntry(e){
  const nuevo=prompt('Editar:',e.text);
  if(nuevo===null||!nuevo.trim()||nuevo.trim()===e.text)return;
  const {error}=await db.from('entries').update({text:nuevo.trim()}).eq('id',e.id);
  if(error)return alert('No se pudo editar.');
  await loadEntries();
}

async function deleteEntry(e){
  if(!confirm(`¿Borrar "${e.text}"?`))return;
  const {error}=await db.from('entries').delete().eq('id',e.id);
  if(error)return alert('No se pudo borrar.');
  if(e.image_path){
    await db.storage.from('pensadero').remove([e.image_path]);
  }
  await loadEntries();
}

async function login(){
  const email=document.getElementById('loginEmail').value.trim();
  const password=document.getElementById('loginPassword').value;
  const msg=document.getElementById('loginMsg');
  msg.textContent='Entrando…';
  const {data,error}=await db.auth.signInWithPassword({email,password});
  if(error){msg.textContent='Email o contraseña incorrectos.';return;}
  currentUser=data.user;
  showEditor();
}

async function logout(){
  await db.auth.signOut();
  currentUser=null;
  document.body.classList.remove('editor');
  document.getElementById('editorBox').style.display='none';
  document.getElementById('loginBox').style.display='';
}

function showEditor(){
  document.body.classList.add('editor');
  document.getElementById('loginBox').style.display='none';
  document.getElementById('editorBox').style.display='';
}

function wire(){
  document.querySelectorAll('#filters .pill').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('#filters .pill').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); activeFilter=b.dataset.filter; render();
  }));
  document.querySelectorAll('#types .type').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('#types .type').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); activeType=b.dataset.type;
  }));
  document.getElementById('composerAdd').addEventListener('click',addEntry);
  document.getElementById('composerInput').addEventListener('keydown',e=>{if(e.key==='Enter')addEntry();});
  document.getElementById('loginBtn').addEventListener('click',login);
  document.getElementById('loginPassword').addEventListener('keydown',e=>{if(e.key==='Enter')login();});
  document.getElementById('logoutBtn').addEventListener('click',logout);
}

async function init(){
  setToday(); wire();

  const wantsAdmin=new URLSearchParams(location.search).get('admin')==='1';
  if(wantsAdmin){
    document.getElementById('adminPanel').classList.add('show');
    if(!configured){
      document.getElementById('loginMsg').textContent='Primero pega tu Project URL y Publishable key en index.html.';
    }else{
      const {data}=await db.auth.getUser();
      currentUser=data?.user||null;
      if(currentUser)showEditor();
    }
  }
  await loadEntries();
}
init();
</script>
</body>
</html>
